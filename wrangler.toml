# PG Hunter — Cloudflare Workers configuration
# Docs: CLOUDFLARE_SETUP.md

name = "pg-hunter"
# Entry point for the Worker built by the Astro Cloudflare adapter (v13).
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# D1 is the primary datastore (see /ai/DATABASE_SCHEMA.md).
# database_id comes from `npx wrangler d1 create pg_hunter` (production).
# Any placeholder works for local development (`--local`).
[[d1_databases]]
binding = "DB"
database_name = "pg_hunter"
database_id = "3a37cc78-3512-4fda-92c7-b53bc6850a72"
migrations_dir = "db/migrations"

# Object storage for owner-uploaded images/documents.
# Bucket: "main" (already created on the Cloudflare account).
# Local: emulated by the dev runtime, so local uploads never touch production.
#
# The Worker talks to R2 through this binding only (see src/lib/server/media.ts).
# The S3-compatible endpoint for this account is
# https://<account-id>.r2.cloudflarestorage.com — it is only needed for external
# tooling (S3 clients, `aws s3` CLI, backups). No S3 keys are used by the app;
# nothing to configure here for the Worker path.
#
# Object keys are namespaced inside the bucket by src/lib/server/media.ts:
#   owners/{ownerId}/listing-images/...      (public photos)
#   owners/{ownerId}/listing-documents/...   (public docs)
#   verification/{ownerId}/...               (private, never served publicly)
# so this bucket can be shared with other keys of yours without collisions.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "main"
# Preview bucket keeps `wrangler dev` / preview deployments off production objects.
preview_bucket_name = "main-preview"

# Comma-separated emails that get admin access automatically (register/login).
#
# Deliberately NOT set here. This repo is public, so a plaintext var would
# publish the admin address. It is stored as an encrypted Worker secret
# instead: `npx wrangler secret put ADMIN_EMAILS`.
# Cloudflare rejects a secret whose name collides with a plaintext var, so the
# var must stay absent.
[vars]
# Canonical origin used to build OAuth redirect URIs (see getSiteUrl()).
#
# This MUST be pinned in production. When unset, getSiteUrl() falls back to the
# request's own origin, so the redirect_uri sent to Google changes with the Host
# header — the workers.dev URL, a preview URL, or a bare-IP request each send a
# *different* redirect_uri, and Google rejects every one that is not the single
# registered value (redirect_uri_mismatch). Pinning it makes the OAuth handshake
# deterministic no matter which hostname served the request.
#
# It is deliberately a plaintext var, not a secret: the domain is public and so
# is this repo. Local dev overrides it via SITE_URL in .dev.vars.
#
# NOTE: a wrong value here breaks sign-in outright, so change it only together
# with the matching entry in the Google OAuth client's Authorized redirect URIs.
SITE_URL = "https://pghunter.in"

# Static assets built by Astro (served by the Worker via the ASSETS binding).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Cloudflare's asset router treats a top-level browser navigation
# (`Sec-Fetch-Mode: navigate`) as "serve a page": when the path matches no
# static asset it returns the 404 page and NEVER invokes the Worker. That
# silently broke every on-demand route reached by navigation, because these
# routes have no .html asset of their own:
#   - the Google OAuth handshake: /api/auth/google and the callback Google
#     redirects back to — sign-in landed on "This page wandered off campus".
#   - every /admin/* page and the on-demand /owner/* pages (edit, plans).
# `fetch()` calls send `Sec-Fetch-Mode: cors` and were unaffected, which is why
# email/password sign-in worked and only the redirect-based flows failed.
#
# These patterns make the Worker run first for exactly those on-demand routes.
# Prerendered pages are not matched, so they keep being served straight from the
# asset store (no added Worker invocations); the Worker also falls back to the
# ASSETS binding itself, so an overlapping match would still be harmless.
#
# Keep this list in sync with `prerender = false` routes outside /api/*.
run_worker_first = [
  "/api/*",
  # Bare index paths need their own entry: `/admin/*` does not match `/admin`.
  "/admin",
  "/admin/*",
  # Live D1 listings: the on-demand detail page for a real owner listing. It is
  # the only /pgs route left — every listing on the site comes from D1, so a
  # /pgs/<id> navigation must reach the Worker or it 404s as a missing asset.
  "/pgs/live",
  "/pgs/live/*",
  "/owner/plans",
  "/owner/plans/*",
  "/owner/listings/*/edit",
  "/owner/listings/*/edit/*",
  # Chat. Both pages render their on-demand half server-side: /messages lists
  # the live PG pages a student can start a conversation about, and
  # /owner/messages lists the students who have enquired. Neither exists as a
  # static asset, so without these entries a plain navigation would 404.
  "/messages",
  "/messages/*",
  "/owner/messages",
]

# Override the site URL used for OAuth redirect URIs. Leave unset to derive
# it from each request's origin (recommended for local + custom domains).
# [vars]
# SITE_URL = "https://pghunter.in"
